<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elegant Logo Animation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    font-family:'Poppins',sans-serif;

    /* LIGHT PREMIUM BACKGROUND */

    background:
    linear-gradient(
    135deg,
    #f8fbff,
    #eef5ff,
    #fdf2f8
    );
}

/* SOFT GLOW BACKGROUND */

.glow{

    position:absolute;

    border-radius:50%;

    filter:blur(90px);

    opacity:0.45;

    animation:floatGlow 8s ease-in-out infinite alternate;
}

.glow1{

    width:320px;
    height:320px;

    background:#93c5fd;

    top:-100px;
    left:-60px;
}

.glow2{

    width:280px;
    height:280px;

    background:#f9a8d4;

    bottom:-80px;
    right:-50px;

    animation-delay:2s;
}

@keyframes floatGlow{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(35px);
    }
}

/* MAIN CONTAINER */

.container{

    position:relative;

    text-align:center;

    z-index:10;
}

/* LOGO SECTION */

.logo-box{

    margin-bottom:45px;
}

/* LOGO */

.logo{

    width:240px;

    opacity:0;

    transform:
    scale(0.3);

    animation:
    smoothPopLogo 1.5s
    cubic-bezier(0.18,0.89,0.32,1.28)
    forwards;

    filter:
    drop-shadow(0 0 12px rgba(59,130,246,0.35))
    drop-shadow(0 0 25px rgba(236,72,153,0.25));
}

/* LOGO POP */

@keyframes smoothPopLogo{

    0%{

        opacity:0;

        transform:
        scale(0.2)
        translateY(40px);
    }

    60%{

        opacity:1;

        transform:
        scale(1.08)
        translateY(0px);
    }

    100%{

        opacity:1;

        transform:
        scale(1)
        translateY(0px);
    }
}

/* MAIN TEXT */

.text{

    font-size:52px;

    font-weight:700;

    color:#1e293b;

    letter-spacing:2px;

    opacity:0;

    transform:
    scale(0.5)
    translateY(20px);

    animation:
    smoothPopText 1.2s
    cubic-bezier(0.18,0.89,0.32,1.28)
    forwards;

    animation-delay:1.2s;

    text-shadow:
    0 4px 15px rgba(0,0,0,0.08);
}

/* TEXT POP */

@keyframes smoothPopText{

    0%{

        opacity:0;

        transform:
        scale(0.5)
        translateY(25px);
    }

    60%{

        opacity:1;

        transform:
        scale(1.05)
        translateY(0px);
    }

    100%{

        opacity:1;

        transform:
        scale(1)
        translateY(0px);
    }
}

/* ANIMATED LINE */

.line{

    width:0;

    height:4px;

    margin:22px auto;

    border-radius:20px;

    background:
    linear-gradient(
    to right,
    #60a5fa,
    #f472b6
    );

    animation:
    lineExpand 1.3s ease forwards;

    animation-delay:2s;
}

@keyframes lineExpand{

    from{
        width:0;
    }

    to{
        width:280px;
    }
}

/* SUBTITLE */

.subtitle{

    margin-top:15px;

    font-size:20px;

    color:#475569;

    letter-spacing:1.5px;

    opacity:0;

    animation:
    fadeUp 1.2s ease forwards;

    animation-delay:2.4s;
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
        translateY(20px);
    }

    to{

        opacity:1;

        transform:
        translateY(0px);
    }
}

/* RESPONSIVE */

@media(max-width:768px){

    .logo{
        width:180px;
    }

    .text{
        font-size:34px;
    }

    .subtitle{
        font-size:16px;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND GLOWS -->

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<!-- MAIN CONTENT -->

<div class="container">

    <!-- LOGO -->

    <div class="logo-box">
        <img src="inamigologo.png" class="logo">
    </div>

    <!-- TEXT -->

    <div class="text">
        InAmigos Foundation
    </div>

    <!-- LINE -->

    <div class="line"></div>

    <!-- SUBTITLE -->

    <div class="subtitle">
        Uniting Minds For Change
    </div>

</div>

</body>
</html>
